name: Clean build of OpenGTA
run-name: 🚘 Test if OpenGTA compiles on multiple platforms
on: [push]

permissions:
  contents: read

env:
  VCPKG_BINARY_SOURCES: 'clear;default,readwrite'

jobs:
  Linux-Build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      # SDL2's vcpkg port requires system X11, Wayland and IBus headers.
      - name: Install build tools and platform prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build autoconf-archive libltdl-dev libglu1-mesa-dev \
            libx11-dev libxft-dev libxext-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev libibus-1.0-dev

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-${{ hashFiles('vcpkg*.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vcpkg-

      - name: Configure OpenGTA
        run: cmake --preset vcpkg -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: ⚒️ Build OpenGTA
        run: cmake --build --preset vcpkg-relwithdebinfo

  Windows-Build:
    runs-on: windows-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Initialize MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-${{ hashFiles('vcpkg*.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vcpkg-

      - name: Configure OpenGTA
        run: cmake --preset vcpkg -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: ⚒️ Build OpenGTA
        run: cmake --build --preset vcpkg-relwithdebinfo
